spring:
  application:
    name: nihongo-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/nihon_mukae
    username: dev
    password: dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-min-256-bits-for-hs256-algorithm!!}
    access-token-expiration-minutes: 15