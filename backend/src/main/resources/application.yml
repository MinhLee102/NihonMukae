spring:
  application:
    name: nihongo-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/nihon_mukae
    username: dev
    password: dev
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
  servlet:
    multipart:
      # File audio của đề có thể vài chục MB; giới hạn thật theo loại file nằm ở MediaService
      max-file-size: 64MB
      max-request-size: 66MB
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-key-min-256-bits-for-hs256-algorithm!!}
    access-token-expiration-minutes: 15
  media:
    # local = thư mục trên ổ đĩa, drive = Google Drive của admin (cần 3 biến GOOGLE_DRIVE_*)
    provider: ${APP_MEDIA_PROVIDER:local}
    local-dir: ${APP_MEDIA_LOCAL_DIR:}
    max-audio-mb: 60
    max-image-mb: 5
    max-total-mb: 20480
    max-uploads-per-hour: 200
    drive:
      client-id: ${GOOGLE_DRIVE_CLIENT_ID:}
      client-secret: ${GOOGLE_DRIVE_CLIENT_SECRET:}
      refresh-token: ${GOOGLE_DRIVE_REFRESH_TOKEN:}
      folder-id: ${GOOGLE_DRIVE_FOLDER_ID:}